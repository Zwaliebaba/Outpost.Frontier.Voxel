  function Icons() { if(globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:16,height:16}}); }

  function Meter(label,value,color='',optional=false) {
    return `<div class="of-bar-row${optional?' optional':''}"><span>${label}</span><div class="of-track" role="progressbar" aria-label="${label}" aria-valuenow="${value}" aria-valuemin="0" aria-valuemax="100"><div class="of-fill" style="--of-value:${value}%;${color?'--of-fill-color:'+color:''}"></div></div><span class="of-number">${value}%</span></div>`;

  function Remember() {
    if(!window.openai?.setWidgetState) return;
    window.openai.setWidgetState({modelContent:{proposal:'Outpost Frontier gameplay UI',context:state.context,dockedTab:state.dockTab,textureFormat:'DDS'},privateContent:{context:state.context,dockTab:state.dockTab,selectedPlan:state.selectedPlan,subtarget:state.subtarget,cargo:state.cargo,design}}).catch(()=>{});
  }
  function Restore(saved) {
    const data = saved?.privateContent;
    if(!data) return;
    if(Object.hasOwn(notes,data.context)) state.context=data.context;
    if(['build','yard','fleet','services'].includes(data.dockTab)) state.dockTab=data.dockTab;
    if(Object.hasOwn(catalog,data.selectedPlan)) state.selectedPlan=data.selectedPlan;
    if(['Hull','Engines','Weapons','Core'].includes(data.subtarget)) state.subtarget=data.subtarget;
    if(Number.isFinite(data.cargo)) state.cargo=Math.min(60,Math.max(0,data.cargo));
    if(data.design) {
      if(/^#[0-9a-f]{6}$/i.test(data.design.accent||'')) design.accent=data.design.accent;
      if(Number.isFinite(data.design.hudScale)) design.hudScale=Math.min(120,Math.max(90,data.design.hudScale));
      if(['Balanced','Compact'].includes(data.design.density)) design.density=data.design.density;
      design.critical=data.design.critical===true;
    }
  }
  function Radar() {
    const canvas=root.querySelector('#of-radar-canvas');
    const width=canvas.clientWidth,height=canvas.clientHeight;
    if(!width||!height) return;
    const ratio=Math.min(2,window.devicePixelRatio||1);
    canvas.width=width*ratio;canvas.height=height*ratio;
    const c=canvas.getContext('2d');c.scale(ratio,ratio);
    const cx=width/2,cy=height/2,r=Math.min(width,height)*.43;
    function Color(variable) {
      const probe=document.createElement('span');probe.style.color='var('+variable+')';probe.hidden=true;game.appendChild(probe);
      const color=getComputedStyle(probe).color;probe.remove();return color;
    }
    c.strokeStyle=Color('--of-line');c.lineWidth=1;
    for(const scale of [.45,1]) {c.beginPath();c.arc(cx,cy,r*scale,0,Math.PI*2);c.stroke();}
    c.beginPath();c.moveTo(cx-r,cy);c.lineTo(cx+r,cy);c.moveTo(cx,cy-r);c.lineTo(cx,cy+r);c.stroke();
    c.fillStyle=design.accent;c.beginPath();c.moveTo(cx,cy-5);c.lineTo(cx-4,cy+4);c.lineTo(cx+4,cy+4);c.fill();
    c.fillStyle=Color('--of-friend');for(const [dx,dy] of [[-.4,.45],[.4,.55]])c.fillRect(cx+dx*r-2,cy+dy*r-2,4,4);
    c.fillStyle=state.context==='combat'?Color('--of-danger'):Color('--of-muted');
    c.save();c.translate(cx+.45*r,cy-.55*r);c.rotate(Math.PI/4);c.fillRect(-3,-3,6,6);c.restore();
  }

    root.style.setProperty('--of-art',`url('${image}')`);
    root.querySelectorAll('[data-context]').forEach(button=>{if(button.tagName==='BUTTON')button.setAttribute('aria-selected',String(button.dataset.context===state.context));});
    root.querySelector('#of-preview-panel').setAttribute('aria-labelledby','of-view-'+state.context);
    game.setAttribute('aria-label',docked?'Docked station command':state.context+' HUD');
    root.querySelector('#of-location').textContent=docked?'KESSLER REACH / SHIPYARD COMMAND':'KESSLER REACH / E-114 LANCER';
    root.querySelector('#of-mode-status').innerHTML=`<span class="of-status-dot"></span><span>${docked?'DOCKED / HANGAR F-01':state.context==='combat'?'COMBAT':state.context==='mining'?'MINING':'FREE FLIGHT'}</span>`;
    const resources=root.querySelector('#of-resource-row');resources.hidden=!docked;
    resources.innerHTML=[['layers','Alloy','12,420'],['mountain','Ore','8,710'],['droplet','Water','4,130'],['zap','Power','2,290'],['users','Crew','36 / 60']].map(([icon,name,value])=>`<span class="of-resource">${Icon(icon)}<label>${name}</label><span>${value}</span></span>`).join('');
    root.querySelector('#of-dock-nav').hidden=!docked;
    own.hidden=docked;radar.hidden=docked;aim.hidden=docked;dockMessage.hidden=!docked;
    const mobile=matchMedia('(max-width:560px)').matches;
    if(mobile&&!docked) {game.querySelector('.of-workspace').append(own,radar,panel);} else {game.querySelector('.of-workspace').insertBefore(own,panel);game.querySelector('.of-workspace').insertBefore(radar,panel);}
    root.querySelector('#of-objective').innerHTML=docked?'OUTPOST / COMMAND VIEW<span>Defend the shipyard · finish F-03</span>':state.context==='combat'?'Defend the shipyard<span>Raid contact · wing available</span>':state.context==='mining'?'Supply the outpost<span>Mine ore and return with cargo</span>':'Return to the shipyard<span>Hangar F-01 · docking available</span>';
    root.querySelector('#of-aim span').textContent=state.context==='combat'?'WEAPONS READY':state.context==='mining'?(state.mining?'MINING ACTIVE':'MINING TOOL READY'):'CURSOR STEERING';
    marker.hidden=state.context==='flight'||docked;
    if(!docked) {
      const position=state.context==='mining'?positions.mining:positions.flight;
      marker.style.left=(position.x*100)+'%';marker.style.top=(position.y*100)+'%';
      marker.classList.toggle('is-hostile',state.context==='combat');
      marker.querySelector('small').textContent=state.context==='combat'?'R-042 / '+state.subtarget.toUpperCase():'ORE SEAM / 180 m';
      root.querySelector('#of-lead-point').style.left=(Math.min(.87,position.x+.065)*100)+'%';
      root.querySelector('#of-lead-point').style.top=(position.y*100+1)+'%';
    }
    root.querySelector('#of-lead-point').hidden=state.context!=='combat';
    OwnShip();if(docked)root.querySelector('#of-critical-warning').hidden=true;
    ContextContent();Footer();
    root.querySelector('#of-context-note').textContent=notes[state.context];
    Icons();requestAnimationFrame(()=>{Radar();PositionMarker();});
  }
  function PositionMarker() {
    const docked=state.context==='docked';
    const point=docked?positions.docked:state.context==='mining'?positions.mining:positions.flight;
    if(!point||marker.hidden)return;
    const w=arena.clientWidth,h=arena.clientHeight;
    const scale=docked?Math.min(w/1152,h/648):Math.max(w/1152,h/648);
    const x=point.x*1152*scale-(1152*scale-w)/2,y=point.y*648*scale-(648*scale-h)/2;
    marker.style.left=x+'px';marker.style.top=y+'px';
    const lead=root.querySelector('#of-lead-point');lead.style.left=(x+w*.065)+'px';lead.style.top=(y+h*.01)+'px';
  }
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button||button.disabled)return;
    if(button.dataset.context) {state.context=button.dataset.context;state.notice='';Render();Remember();return;}
    if(button.dataset.dockTab) {state.dockTab=button.dataset.dockTab;state.notice='';Render();Remember();return;}
    if(button.dataset.plan) {state.selectedPlan=button.dataset.plan;state.placement=false;state.construction=false;Render();Remember();return;}
    if(button.dataset.subtarget) {state.subtarget=button.dataset.subtarget;Render();Remember();return;}
    const action=button.dataset.action;if(!action)return;
    let message='';
    if(action==='launch') {message='Launch requested · awaiting clearance';}
    else if(action==='request-dock') message='Docking requested · awaiting clearance';
    else if(action==='build') {if(state.placement)state.construction=true;else state.placement=true;Render();message=state.construction?'Build request queued for F-03':'Choose the highlighted compatible socket';}
    else if(action==='mine') {state.mining=!state.mining;Render();message=state.mining?'Mining tool active':'Mining tool stopped';}
    else if(action==='collect') {state.cargo=Math.min(60,state.cargo+6);if(state.cargo===60)state.mining=false;Render();message=state.cargo===60?'Hold full · return to the outpost':'Ore collected · '+state.cargo+' / 60 m³';}
    else if(action==='hold-fire') {state.holdFire=!state.holdFire;Render();message=state.holdFire?'Hold-fire order requested':'Weapons-free order requested';}
    else message=({form:'Form-up order requested',attack:'Attack-target order requested',defend:'Defend order requested','dock-wing':'Wing docking requested','fleet-dock':'T-041 docking requested','fleet-hold':'T-041 hold requested','fleet-defend':'T-041 defend requested','yard-hull':'Lancer hull selected','yard-build':'Escort build requested','yard-refit':'E-114 refit requested',repair:'Hangar repair requested',save:'Save requested'})[action]||'Order requested';
    state.notice=message;const status=root.querySelector('#of-order-message');if(status)status.textContent=message;
    Remember();
  });
  root.querySelector('.of-mode-nav').addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    const buttons=Array.from(root.querySelectorAll('.of-mode-nav button'));
    const index=buttons.findIndex(button=>button.getAttribute('aria-selected')==='true');
    const next=event.key==='Home'?0:event.key==='End'?buttons.length-1:(index+(event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;
    event.preventDefault();buttons[next].click();buttons[next].focus();
  });
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){Restore(event.detail.globals.widgetState);Render();}});
  Restore(window.openai?.widgetState);Render();
  new ResizeObserver(()=>{requestAnimationFrame(()=>{Radar();PositionMarker();});}).observe(root);
  matchMedia('(max-width:560px)').addEventListener('change',Render);
  if(globalThis.Tweak) {
    const tweak=new Tweak({container:root,onChange:()=>{Render();Remember();}});
    tweak.addColorPicker(design,'accent',{label:'HUD accent',reference:'--of-accent'});
    tweak.addSlider(design,'hudScale',{label:'HUD text scale',min:90,max:120,step:5,unit:'%'});
    tweak.addSelect(design,'density',{label:'Information density',options:['Balanced','Compact']});
    tweak.addToggle(design,'critical',{label:'Preview critical damage'});
  }
})();
</script>
